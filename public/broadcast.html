<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도전미션 별풍선 TOP5</title>
  <link rel="stylesheet" href="style.css" />
  <!--
    OBS 브라우저 소스 등에 그대로 얹을 수 있도록 배경을 투명하게 만들었습니다.
    이 화면은 서버(server.js)가 SoopScope에서 조회해둔 결과만 받아서 보여줍니다.
  -->
  <style>
    body {
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 id="missionTitle">🔥 도전미션 별풍선 TOP5</h1>
    </header>

    <!-- 30만 개 목표 진행률 카드 (진행 중인 모든 도전미션의 별풍선 총합 기준) -->
    <section class="progress-card" id="progressCard">
      <div class="progress-top">
        <span class="progress-label" id="progressLabel">🎯 목표</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="progress-numbers">
        <span>현재 <strong id="progressCurrent">0</strong>개</span>
        <span>목표 <strong id="progressGoal">300,000</strong>개</span>
        <span>남은 <strong id="progressRemaining">300,000</strong>개</span>
      </div>
    </section>

    <section class="ranking">
      <ol id="rankingList" class="ranking-list"></ol>
      <p id="emptyMessage" class="empty-message" hidden>현재 진행 중인 도전미션이 없습니다.</p>
    </section>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
